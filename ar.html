<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poppy AR — test AR</title>
<style>
  :root { --bg:#0f1115; --card:rgba(20,23,30,.86); --line:#2a2f3a; --text:#e8eaf0; --dim:#9aa3b2; --ok:#4cc38a; --warn:#e8b04b; --bad:#ef6b6b; --accent:#6ea8fe; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  #video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; background:#000; }
  #gl { position:fixed; inset:0; width:100%; height:100%; z-index:1; touch-action:none; }
  #overlay { position:fixed; inset:0; z-index:2; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between;
             padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; pointer-events:auto; }
  h1 { font-size:18px; margin:0 0 4px; }
  #status { color:var(--dim); font-size:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 14px; background:var(--accent); color:#0b1220; flex:1; min-width:120px; }
  button.secondary { background:#2a3140; color:var(--text); }
  button:disabled { opacity:.45; }
  #hud { font:12px/1.4 ui-monospace,monospace; color:var(--dim); margin-top:6px; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<video id="video" playsinline muted hidden></video>
<canvas id="gl"></canvas>
<div id="overlay">
  <div class="panel">
    <h1>Poppy AR — test AR</h1>
    <div id="status">Sprawdzam, jakie AR obsługuje telefon…</div>
  </div>
  <div class="panel">
    <div class="row">
      <button id="startBtn" disabled>Start</button>
      <button id="walkBtn" class="secondary" disabled>Stój</button>
    </div>
    <div id="hud"></div>
  </div>
</div>

<script type="module">
import * as THREE from "three";

const $ = (id) => document.getElementById(id);
const status = (html) => { $("status").innerHTML = html; };
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 50);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(1, 3, 2); scene.add(sun);

// ---------- placeholder robot at Poppy scale (0.83 m tall) ----------
function makeRobot() {
  const g = new THREE.Group();
  const body = new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.5, metalness: 0.1 });
  const joint = new THREE.MeshStandardMaterial({ color: 0x2b2f38, roughness: 0.6 });
  const accent = new THREE.MeshStandardMaterial({ color: 0x6ea8fe, roughness: 0.4 });
  const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  const torso = box(0.16, 0.22, 0.10, body); torso.position.y = 0.56; g.add(torso);
  const pelvis = box(0.14, 0.06, 0.09, joint); pelvis.position.y = 0.43; g.add(pelvis);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.065, 24, 16), body); head.position.y = 0.745; g.add(head);
  const visor = box(0.09, 0.03, 0.02, accent); visor.position.set(0, 0.75, 0.058); g.add(visor);
  const limb = (len, w, m) => { const p = new THREE.Group(); const b = box(w, len, w, m); b.position.y = -len / 2; p.add(b); return p; };
  const legs = [], arms = [];
  for (const s of [-1, 1]) {
    const hip = limb(0.19, 0.05, body); hip.position.set(s * 0.045, 0.41, 0); g.add(hip);
    const knee = limb(0.19, 0.045, body); knee.position.y = -0.19; hip.add(knee);
    const foot = box(0.06, 0.025, 0.11, joint); foot.position.set(0, -0.2, 0.02); knee.add(foot);
    legs.push({ hip, knee, s });
    const sh = limb(0.15, 0.04, body); sh.position.set(s * 0.105, 0.65, 0); g.add(sh);
    const el = limb(0.14, 0.035, body); el.position.y = -0.15; sh.add(el);
    arms.push({ sh, el, s });
  }
  // contact shadow on the floor
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.16, 32), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.002; g.add(shadow);
  g.userData = { legs, arms, shadow };
  return g;
}
const robot = makeRobot(); robot.visible = false; scene.add(robot);

let walking = true, phase = 0, heading = 0;
const anchor = new THREE.Vector3();          // where the robot was placed (centre of its walking loop)
function animateRobot(dt) {
  if (!robot.visible) return;
  const { legs, arms } = robot.userData;
  if (walking) {
    phase += dt * 2 * Math.PI * 1.1;           // ~1.1 steps per second per leg
    heading += dt * 0.35;                      // walk a 0.4 m circle around the anchor
    const r = 0.4;
    robot.position.set(anchor.x + r * Math.sin(heading), anchor.y, anchor.z + r * Math.cos(heading));
    robot.rotation.y = heading + Math.PI / 2;
  }
  const a = walking ? 0.45 : 0;
  for (const { hip, knee, s } of legs) {
    const p = phase + (s > 0 ? Math.PI : 0);
    hip.rotation.x = a * Math.sin(p);
    knee.rotation.x = walking ? Math.max(0, 0.8 * Math.sin(p + 1.2)) : 0;
  }
  for (const { sh, el, s } of arms) {
    sh.rotation.x = -0.6 * a * Math.sin(phase + (s > 0 ? 0 : Math.PI));
    el.rotation.x = -0.3;
  }
  robot.position.y = anchor.y + (walking ? 0.008 * Math.abs(Math.sin(phase)) : 0);
}

// ---------- FPS ----------
let frames = 0, fpsT = performance.now(), fps = 0, mode = "";
function tickFps() {
  frames++; const now = performance.now();
  if (now - fpsT > 1000) { fps = (frames * 1000) / (now - fpsT); frames = 0; fpsT = now;
    $("hud").innerHTML = `tryb: ${mode} · <span class="${fps > 40 ? "ok" : fps > 24 ? "warn" : "bad"}">${fps.toFixed(0)} kl./s</span>`; }
}

$("walkBtn").onclick = () => { walking = !walking; $("walkBtn").textContent = walking ? "Stój" : "Idź"; };

// =============== MODE 1: WebXR immersive-ar with floor hit-test ===============
let reticle, hitSource = null;
async function startWebXR() {
  mode = "WebXR (śledzenie podłogi)";
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType("local");
  reticle = new THREE.Mesh(new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x6ea8fe }));
  reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
  // try the full configuration first, then simpler ones (some phones refuse hit-test or dom-overlay)
  const configs = [
    { label: "pełne (podłoga + nakładka)", opts: { requiredFeatures: ["hit-test"], optionalFeatures: ["dom-overlay", "local-floor"], domOverlay: { root: $("overlay") } } },
    { label: "podłoga bez nakładki", opts: { requiredFeatures: ["hit-test"] } },
    { label: "bez wykrywania podłogi", opts: { optionalFeatures: ["hit-test", "local-floor", "dom-overlay"], domOverlay: { root: $("overlay") } } },
    { label: "minimalne", opts: {} },
  ];
  let session = null, used = null; const errors = [];
  for (const c of configs) {
    try { session = await navigator.xr.requestSession("immersive-ar", c.opts); used = c; break; }
    catch (e) { errors.push(`${c.label}: ${e.name}`); }
  }
  if (!session) throw new Error("telefon odrzucił każdą konfigurację AR (" + errors.join("; ") + "). Sprawdź w Sklepie Play „Usługi Google Play dla AR”");
  mode = "WebXR: " + used.label;
  await renderer.xr.setSession(session);
  try {
    const viewer = await session.requestReferenceSpace("viewer");
    hitSource = await session.requestHitTestSource({ space: viewer });
  } catch { hitSource = null; }
  const placeAhead = () => {
    // no floor detection: put the robot 1.2 m ahead, 1.3 m below the phone's starting height
    const cam = renderer.xr.getCamera();
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion); dir.y = 0; dir.normalize();
    anchor.copy(cam.position).addScaledVector(dir, 1.2); anchor.y = cam.position.y - 1.3;
  };
  session.addEventListener("select", () => {
    if (hitSource && reticle.visible) anchor.setFromMatrixPosition(reticle.matrix);
    else if (!hitSource) placeAhead();
    else return;
    heading = 0; robot.visible = true; $("walkBtn").disabled = false;
    status(hitSource ? "Robot stoi na podłodze. Obejdź go dookoła. Stuknij w inne miejsce, żeby go przestawić."
                     : "Robot postawiony bez wykrycia podłogi (może wisieć lub być w podłodze). Obejdź go dookoła.");
  });
  session.addEventListener("end", () => { hitSource = null; status("Sesja AR zakończona. Kliknij Start, żeby wrócić."); $("startBtn").disabled = false; });
  status(hitSource ? "Powoli poruszaj telefonem, kierując go na podłogę. Gdy pojawi się niebieskie kółko, stuknij ekran."
                   : '<span class="warn">AR działa, ale bez wykrywania podłogi.</span> Stuknij ekran, żeby postawić robota przed sobą.'
                     + (errors.length ? "<br><small>" + errors.join("; ") + "</small>" : ""));
  $("startBtn").disabled = true;
  let last = performance.now();
  renderer.setAnimationLoop((t, frame) => {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    if (frame && hitSource) {
      const hits = frame.getHitTestResults(hitSource);
      if (hits.length) {
        const pose = hits[0].getPose(renderer.xr.getReferenceSpace());
        reticle.visible = true; reticle.matrix.fromArray(pose.transform.matrix);
      } else reticle.visible = false;
    }
    animateRobot(dt); renderer.render(scene, camera); tickFps();
  });
}

// =============== MODE 2: camera + gyroscope (no tracking of steps) ===============
const EYE = 1.3;                 // assumed phone height above the floor [m]
let orient = null, screenAngle = 0;
const zee = new THREE.Vector3(0, 0, 1), euler = new THREE.Euler(), q0 = new THREE.Quaternion(),
      q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));   // -90 deg about X: camera looks out of the back
function deviceQuaternion(o) {
  const deg = THREE.MathUtils.DEG2RAD;
  euler.set(o.beta * deg, o.alpha * deg, -o.gamma * deg, "YXZ");
  const q = new THREE.Quaternion().setFromEuler(euler);
  q.multiply(q1);
  q.multiply(q0.setFromAxisAngle(zee, -screenAngle * deg));
  return q;
}
async function startGyro() {
  mode = "kamera + żyroskop";
  // iOS asks for motion permission from a tap
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    const r = await DeviceOrientationEvent.requestPermission().catch(() => "denied");
    if (r !== "granted") { status('<span class="bad">Bez zgody na czujnik ruchu robot nie zostanie w miejscu.</span> Zezwól w Safari i spróbuj ponownie.'); }
  }
  addEventListener("deviceorientation", (e) => { if (e.alpha !== null) orient = { alpha: e.alpha, beta: e.beta, gamma: e.gamma }; });
  const so = () => { screenAngle = (screen.orientation && screen.orientation.angle) || window.orientation || 0; };
  so(); addEventListener("orientationchange", so);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    const v = $("video"); v.srcObject = stream; v.hidden = false; await v.play();
  } catch (e) { status('<span class="bad">Brak dostępu do kamery (' + e.name + ').</span>'); }

  camera.position.set(0, EYE, 0);
  status("Skieruj telefon w dół na podłogę przed sobą i stuknij ekran, żeby postawić robota.");
  canvas.addEventListener("click", placeGyro);
  $("startBtn").textContent = "Postaw robota"; $("startBtn").onclick = placeGyro; $("startBtn").disabled = false;

  let last = performance.now();
  renderer.setAnimationLoop((t) => {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    if (orient) camera.quaternion.copy(deviceQuaternion(orient));
    animateRobot(dt); renderer.render(scene, camera); tickFps();
  });
}
function placeGyro() {
  // intersect the camera's view ray with the floor (y = 0); if looking up, put it 1.5 m ahead
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  let dist = dir.y < -0.15 ? EYE / -dir.y : 1.5;
  dist = Math.min(Math.max(dist, 0.8), 4);
  const flat = new THREE.Vector3(dir.x, 0, dir.z).normalize();
  anchor.set(flat.x * dist, 0, flat.z * dist); heading = 0;
  robot.visible = true; $("walkBtn").disabled = false;
  status(orient ? "Robot stoi. Obracaj telefonem, a zostanie w tym samym miejscu (nie podchodź, ten tryb nie śledzi kroków)."
                : '<span class="warn">Brak danych z żyroskopu, robot porusza się razem z telefonem.</span>');
}

addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- pick the best mode ----------
(async () => {
  let xr = false;
  if (navigator.xr) { try { xr = await navigator.xr.isSessionSupported("immersive-ar"); } catch {} }
  if (xr) {
    status('<span class="ok">Telefon obsługuje pełne AR (WebXR).</span> Kliknij Start i zezwól na kamerę.');
    $("startBtn").textContent = "Start AR";
    $("startBtn").onclick = () => startWebXR().catch((e) => status('<span class="bad">Nie udało się uruchomić AR: ' + e.message + "</span>"));
  } else {
    status('<span class="warn">Brak WebXR na tym telefonie</span>, użyję kamery i żyroskopu. Kliknij Start.');
    $("startBtn").textContent = "Start";
    $("startBtn").onclick = () => { $("startBtn").disabled = true; startGyro(); };
  }
  $("startBtn").disabled = false;
})();
</script>
</body>
</html>
